name: Android Build

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v3

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'adopt'

      - name: Decode google-services.json
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_JSON }}
        run: echo $FIREBASE_JSON > composeApp/google-services.json

      - name: Create local.properties
        run: |
          echo "EMAILJS_PUBLIC_KEY=${{ secrets.EMAILJS_PUBLIC_KEY }}" >> local.properties
          echo "EMAILJS_SERVICE_ID=${{ secrets.EMAILJS_SERVICE_ID }}" >> local.properties
          echo "EMAILJS_TEMPLATE_ID=${{ secrets.EMAILJS_TEMPLATE_ID }}" >> local.properties
          echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" >> local.properties
          echo "SUPABASE_ANON_KEY_RELEASE=${{ secrets.SUPABASE_ANON_KEY_RELEASE }}" >> local.properties
          echo "SUPABASE_URL_RELEASE=${{ secrets.SUPABASE_URL_RELEASE }}" >> local.properties
          echo "N8N_WEBHOOK_PATH_RELEASE=${{ secrets.N8N_WEBHOOK_PATH_RELEASE }}" >> local.properties
          echo "FIREBASE_FUNCTION_URL=${{ secrets.FIREBASE_FUNCTION_URL }}" >> local.properties
          echo "FIREBASE_FUNCTION_API_KEY=${{ secrets.FIREBASE_FUNCTION_API_KEY }}" >> local.properties

      - name: Build Debug and Run Tests
        run: ./gradlew assembleDebug testDebugUnitTest lint --continue

      - name: Upload Test Reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  dependency-submission:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v4

      - name: Create local.properties
        run: |
          echo "EMAILJS_PUBLIC_KEY=${{ secrets.EMAILJS_PUBLIC_KEY }}" >> local.properties
          echo "EMAILJS_SERVICE_ID=${{ secrets.EMAILJS_SERVICE_ID }}" >> local.properties
          echo "EMAILJS_TEMPLATE_ID=${{ secrets.EMAILJS_TEMPLATE_ID }}" >> local.properties
          echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" >> local.properties
          echo "SUPABASE_ANON_KEY_RELEASE=${{ secrets.SUPABASE_ANON_KEY_RELEASE }}" >> local.properties
          echo "SUPABASE_URL_RELEASE=${{ secrets.SUPABASE_URL_RELEASE }}" >> local.properties
          echo "N8N_WEBHOOK_PATH_RELEASE=${{ secrets.N8N_WEBHOOK_PATH_RELEASE }}" >> local.properties
          echo "FIREBASE_FUNCTION_URL=${{ secrets.FIREBASE_FUNCTION_URL }}" >> local.properties
          echo "FIREBASE_FUNCTION_API_KEY=${{ secrets.FIREBASE_FUNCTION_API_KEY }}" >> local.properties

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v3
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"
