name: Build and Deploy Android App

on:
  push:
    branches:
      - main

#  For testing the action manually it can be done executing:
#  gh workflow run deploy.yml environment=release --ref <Branch>
#  gh run list --workflow=deploy.yml
#
  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Deploy
    environment: release
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v3

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'adopt'

      - name: Decode google-services.json
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_JSON }}
        run: echo $FIREBASE_JSON > composeApp/google-services.json

      - name: Decode Keystore
        env:
          SIGNING_STORE_FILE: ${{ secrets.SIGNING_STORE_FILE }}
        run: echo "$SIGNING_STORE_FILE" | base64 --decode > composeApp/keystore.jks

      - name: Create local.properties
        run: |
          echo "EMAILJS_PUBLIC_KEY=${{ secrets.EMAILJS_PUBLIC_KEY }}" >> local.properties
          echo "EMAILJS_SERVICE_ID=${{ secrets.EMAILJS_SERVICE_ID }}" >> local.properties
          echo "EMAILJS_TEMPLATE_ID=${{ secrets.EMAILJS_TEMPLATE_ID }}" >> local.properties
          echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" >> local.properties
          echo "SUPABASE_ANON_KEY_RELEASE=${{ secrets.SUPABASE_ANON_KEY_RELEASE }}" >> local.properties
          echo "SUPABASE_URL_RELEASE=${{ secrets.SUPABASE_URL_RELEASE }}" >> local.properties
          echo "N8N_WEBHOOK_PATH_RELEASE=${{ secrets.N8N_WEBHOOK_PATH_RELEASE }}" >> local.properties
          echo "signing.keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}" >> local.properties
          echo "signing.keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}" >> local.properties
          echo "signing.storeFile=keystore.jks" >> local.properties
          echo "signing.storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}" >> local.properties
          echo "FIREBASE_FUNCTION_URL=${{ secrets.FIREBASE_FUNCTION_URL }}" >> local.properties
          echo "FIREBASE_FUNCTION_API_KEY=${{ secrets.FIREBASE_FUNCTION_API_KEY }}" >> local.properties

      - name: Assemble
        run: ./gradlew assembleRelease bundleRelease

      # Signing is handled by Gradle signingConfig in build.gradle.kts

      # https://github.com/actions/upload-artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            composeApp/build/outputs/bundle/**/*.aab
            composeApp/build/outputs/apk/**/*.apk
            composeApp/build/outputs/apk/
            composeApp/prod/release/*.aab
            composeApp/prod/release/*.apk

      # https://github.com/r0adkll/upload-google-play
      - name: Publish to Google Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_GOOGLE_PLAY_CONSOLE_JSON }}
          packageName: com.apptolast.spaindecides
          releaseFiles: composeApp/build/outputs/bundle/prodRelease/composeApp-prod-release.aab
          track: internal
          status: draft
          whatsNewDirectory: distribution/whatsnew
        continue-on-error: true

